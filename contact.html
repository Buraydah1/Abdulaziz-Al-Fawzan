<section class="intro-section" style="padding-top:140px;">
    <h2>Let's Get in Touch</h2>
    <form class="contact-form" action="#" method="post" style="max-width:600px;margin:auto;text-align:left;">
        <label>Full Name:</label>
        <input type="text" placeholder="Your Name" style="width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;">
        <label>Email Address:</label>
        <input type="email" placeholder="name@example.com" style="width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;">
        <label>Message:</label>
        <textarea rows="5" placeholder="Type your message..." style="width:100%;padding:10px;margin:8px 0;border:none;border-radius:6px;"></textarea>
        <button type="submit" class="btn" style="border:none;margin-top:10px;">Send Message</button>
    </form>
</section>
